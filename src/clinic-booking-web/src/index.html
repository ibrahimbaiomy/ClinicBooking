<!doctype html>
<!-- Arabic is the default language (D26). The inline script below corrects lang and dir from the
     saved choice before anything is painted; the app then keeps them in sync (LanguageService). -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>ClinicBooking</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try {
      var saved = localStorage.getItem('clinicbooking.lang');
      if (saved === 'ar' || saved === 'en') {
        document.documentElement.lang = saved;
        document.documentElement.dir = saved === 'ar' ? 'rtl' : 'ltr';
      }
    } catch (e) { /* storage unavailable: keep the default */ }
  </script>
  <style>
    /* Shown only until the app starts (silent sign-in); text-free so nothing needs translating. */
    .cb-boot { width: 2rem; height: 2rem; margin: 30vh auto 0; border: 3px solid #cbd5e1;
      border-top-color: #1d4ed8; border-radius: 50%; animation: cb-spin 0.8s linear infinite; }
    @keyframes cb-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .cb-boot { animation: none; } }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <cb-root><div class="cb-boot" role="presentation"></div></cb-root>
</body>
</html>
