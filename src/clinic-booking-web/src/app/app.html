<header
  class="flex items-center justify-between gap-4 border-b border-slate-200 bg-white px-6 py-3"
>
  <div class="flex flex-wrap items-center gap-6">
    <h1 class="text-lg font-semibold">{{ 'app.title' | transloco }}</h1>
    @if (session.isAuthenticated()) {
      <nav [attr.aria-label]="'shell.nav.label' | transloco">
        <a
          routerLink="/specialties"
          routerLinkActive="font-semibold text-blue-700"
          ariaCurrentWhenActive="page"
          class="rounded text-sm text-slate-700 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
        >
          {{ 'shell.nav.specialties' | transloco }}
        </a>
      </nav>
    }
  </div>
  <div class="flex items-center gap-3">
    @if (session.user(); as user) {
      <span class="text-sm text-slate-600">
        {{ 'shell.signed_in_as' | transloco }}
        <strong class="font-semibold text-slate-900" dir="auto">{{ user.userName }}</strong>
      </span>
      <button
        type="button"
        class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
        (click)="signOut()"
      >
        {{ 'shell.sign_out' | transloco }}
      </button>
    }
    <cb-language-switcher />
  </div>
</header>

<main class="p-6">
  <router-outlet />
</main>
