<button
  #toggleButton
  type="button"
  class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="panelId()"
  (click)="toggle()"
>
  @if (activeCount() === 0) {
    {{ 'filter.button' | transloco }}
  } @else {
    {{ 'filter.button_count' | transloco: { count: activeCount() } }}
  }
</button>

@if (open()) {
  <div
    #panel
    [id]="panelId()"
    class="absolute start-0 top-full z-20 mt-2 w-80 max-w-[calc(100vw-2rem)] space-y-4 rounded-lg border border-slate-200 bg-white p-4 shadow-lg sm:start-auto sm:end-0"
  >
    <ng-content />
    <div class="flex flex-wrap justify-end gap-2">
      <button
        type="button"
        class="filter-clear rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
        (click)="clear()"
      >
        {{ 'filter.clear' | transloco }}
      </button>
      <button
        type="button"
        class="filter-apply rounded-lg bg-blue-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
        (click)="apply()"
      >
        {{ 'filter.apply' | transloco }}
      </button>
    </div>
  </div>
}
